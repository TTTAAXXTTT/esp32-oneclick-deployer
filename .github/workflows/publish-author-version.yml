name: Build and publish v1.1.1 author information

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-author-version.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-author-version
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve reviewed source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the reviewed author information and documentation update
        shell: python
        run: |
          import base64, hashlib, io, json
          from pathlib import Path
          import zipfile
          payload = base64.b64decode('')
          assert hashlib.sha256(payload).hexdigest() == 'fab6d7b46267288126782e65ade393d006b6f9e2fe5e428323c427cf3f42bd79'
          root = Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              manifest = json.loads(archive.read('PATCH-MANIFEST.json'))
              assert set(archive.namelist()) == set(manifest) | {'PATCH-MANIFEST.json'}
              replacements = []
              for name, metadata in manifest.items():
                  target = (root / name).resolve()
                  assert target.is_relative_to(root) and name.split('/')[0] not in ('.git', '.github')
                  value = archive.read(name)
                  assert hashlib.sha256(value).hexdigest() == metadata['sha256']
                  current = hashlib.sha256(target.read_bytes()).hexdigest() if target.is_file() else None
                  assert current in (metadata['before_sha256'], metadata['sha256']), 'Source changed since review: ' + name
                  replacements.append((target, value))
              for target, value in replacements:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(value)
          assert '作者QQ：230154231' in (root / 'README.md').read_text('utf-8')
          assert 'author-info-v1.1.1.png' not in (root / 'README.md').read_text('utf-8')
      - name: Fetch the existing verified build inputs
        shell: pwsh
        run: |
          $inputDirectory = Join-Path $env:RUNNER_TEMP 'author-release-inputs'
          New-Item -ItemType Directory -Path $inputDirectory -Force | Out-Null
          gh release download v1.1.0 --pattern ESP32-OneClick-Source-v1.1.0.zip --pattern SHA256SUMS.txt --dir $inputDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore firmware and Arduino CLI with manifest verification
        shell: python
        run: |
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path.cwd()
          inputs = Path(os.environ['RUNNER_TEMP']) / 'author-release-inputs'
          name = 'ESP32-OneClick-Source-v1.1.0.zip'
          sums = {line.split(None, 1)[1].strip(): line.split(None, 1)[0] for line in (inputs / 'SHA256SUMS.txt').read_text('utf-8-sig').splitlines()}
          assert hashlib.sha256((inputs / name).read_bytes()).hexdigest() == sums[name]
          manifests = [
              ('firmware/agent-n16r8.bin', json.loads((root / 'firmware/manifest.json').read_text('utf-8-sig'))),
              ('tools/arduino-cli.exe', json.loads((root / 'tools/manifest.json').read_text('utf-8-sig'))['arduino_cli']),
          ]
          with zipfile.ZipFile(inputs / name) as archive:
              for name, metadata in manifests:
                  data = archive.read('ESP32-OneClick-Source-v1.1.0/' + name)
                  assert len(data) == metadata['size'] and hashlib.sha256(data).hexdigest() == metadata['sha256']
                  (root / name).write_bytes(data)
      - name: Install the pinned build dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the deployment and update regression suite
        run: python -m unittest discover -s tests -v
      - name: Build the Windows portable application
        shell: pwsh
        run: |
          .\build.ps1 -Python (Get-Command python).Source -OutputDirectory (Join-Path $env:RUNNER_TEMP 'author-release-build')
      - name: Verify the frozen EXE without opening a serial port
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'author-release-build'
          report = root / 'self-test.json'
          result = subprocess.run([str(root / 'ESP32-OneClick/ESP32-OneClick.exe'), '--self-test', str(report)], timeout=120)
          assert result.returncode == 0
          data = json.loads(report.read_text('utf-8'))
          assert data['ok'] and data['app_version'] == '1.1.1' and data['serial_port_opened'] is False
          print(json.dumps(data, indent=2))
      - name: Commit the tested source and documentation
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Add author QQ, startup information window and v1.1.1 documentation'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Package the complete source and checksum list
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'author-release-build') -Filter 'ESP32-OneClick-Windows-x64-*.zip')[0]
          python tools/package_release.py --input-portable $portable.FullName --output-dir (Join-Path $env:RUNNER_TEMP 'author-release-assets')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish v1.1.1 and refresh the earlier release contact details
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          git tag -f v1.1.1 $commit
          git push origin refs/tags/v1.1.1 --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'author-release-assets'
          $portable = Join-Path $assetDirectory 'ESP32-OneClick-N16R8-Windows-x64-v1.1.1.zip'
          $source = Join-Path $assetDirectory 'ESP32-OneClick-Source-v1.1.1.zip'
          $checksums = Join-Path $assetDirectory 'SHA256SUMS.txt'
          gh release view v1.1.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.1 $portable $source $checksums --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit v1.1.1 --notes-file RELEASE-v1.1.1.md --latest
          } else {
            gh release create v1.1.1 $portable $source $checksums --target $commit --title 'ESP32 OneClick Deployer v1.1.1 · 作者信息版' --notes-file RELEASE-v1.1.1.md --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v1.1.0 --notes-file RELEASE-v1.1.0.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
