name: Initialize complete independent project source

on:
  push:
    branches: [main]
    paths: [initial-project.zip, .github/workflows/initialize-project.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: initialize-independent-project
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: windows-latest
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand the reviewed project source once
        id: source
        shell: python
        run: |
          import hashlib, os
          from pathlib import Path
          import zipfile
          archive = Path('initial-project.zip')
          ready = archive.is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('ready=' + str(ready).lower(), file=output)
          if ready:
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'e7193e867a6f7d733f4d67d5cef3d4dcf99a32b40ab89b9461d6d28c814ab44c'
              root = Path.cwd().resolve()
              with zipfile.ZipFile(archive) as source:
                  for entry in source.infolist():
                      target = (root / entry.filename).resolve()
                      assert target.is_relative_to(root)
                      assert entry.filename.split('/')[0] not in ('.git', '.github')
                  source.extractall(root)
              for name in ('INITIALIZE.json', 'GUIDE.zh-CN.md', 'windows-deployer-v1.1.0.jpg', 'windows-deployer-flow.svg', 'package_release.py'):
                  (root / name).unlink(missing_ok=True)
      - name: Install pinned Python dependencies
        if: steps.source.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - name: Run project tests without hardware
        if: steps.source.outputs.ready == 'true'
        run: python -m unittest discover -s tests -v
      - name: Commit the expanded source to main
        if: steps.source.outputs.ready == 'true'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath initial-project.zip
          git config user.name 'TTTAAXXTTT'
          git config user.email '62324848+TTTAAXXTTT@users.noreply.github.com'
          git add --all
          git commit -m 'Publish complete independent project source, tests and illustrated docs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
